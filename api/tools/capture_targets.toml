# Phase 0.5 verification targets for tools/source_capture.py.
#
# Every URL below was OBSERVED in a search-engine index or a secondary source on
# 2026-11-05 (see SOURCES.md). None has been fetched from this project yet: the
# build environment's network policy blocked all court hosts. Run:
#
#   cd api && uv run python -m tools.source_capture --targets tools/capture_targets.toml
#
# from a machine that can reach them (ideally an Indian IP, since some government
# sites geofence). Files land in the git-ignored private/source-captures/.
#
# capability: cause_list | case_status | orders | display_board | policy | index | other

# --- High Court of Jammu & Kashmir and Ladakh -----------------------------------
[[target]]
id = "jkhc-home"
url = "https://jkhighcourt.nic.in/"
source_key = "hc_jk_site"
capability = "index"
note = "Find the cause-list index page, daily vs weekly lists, Jammu wing paths, terms page."

[[target]]
id = "jkhc-causelist-sgr-weekly-2026-10-21"
url = "https://jkhighcourt.nic.in/upload/causelist/sgr/2026/Oct/weeklycauselist_21102026/entirelist_sgr.pdf"
source_key = "hc_jk_site"
capability = "cause_list"
note = "Weekly Srinagar list, URL seen in search index. Check layout: court, bench, serial, case no., parties, counsel."

[[target]]
id = "jkhc-display-board-sgr"
url = "https://jkhc.gov.in/dis/"
source_key = "hc_jk_display"
capability = "display_board"
note = "Digital Display Board (Srinagar wing) per search index. Capture several times in court hours to see refresh behaviour."

