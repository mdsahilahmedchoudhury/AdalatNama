# Phase 0.5 verification targets for tools/source_capture.py.
#
# URLs were first found by desk research (2026-11-05) and verified live on
# 2026-11-10 (see SOURCES.md §8 for outcomes). Re-run to refresh fixtures:
#
#   cd api && uv run python -m tools.source_capture --targets tools/capture_targets.toml
#
# Some government hosts drop or refuse non-Indian traffic; run from an Indian
# network if a host is "unreachable". Files land in the git-ignored
# private/source-captures/ because they name real people.
#
# capability: cause_list | case_status | orders | display_board | policy | index | other

# --- High Court of Jammu & Kashmir and Ladakh (pilot) -----------------------------
